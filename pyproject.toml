[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "B", "I", "C90", "N", "UP", "A", "S", "PT", "ARG", "PTH"]
ignore = ["S101", "PTH123", "PT011", "PT009", "ARG001", "ARG002", "UP035", "S310", "E501", "C901", "N818"]

[tool.ruff.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
minversion = "6.0"
addopts = "-ra -q"
filterwarnings = [
    "ignore:.*Pyarrow.*:UserWarning",
    "ignore:.*openpyxl.*:UserWarning",
]
